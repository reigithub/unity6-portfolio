# docker/unity-server/prod/cloudbuild.yml
# Unity Dedicated Server: Cloud Build -> Artifact Registry -> GCE MIG デプロイ
#
# 使用方法:
#   cd Unity6Portfolio
#   gcloud builds submit --config=docker/unity-server/prod/cloudbuild.yml \
#     --substitutions=_ZONE=asia-northeast1-b,_GAME_SERVER_URL=https://game-server-xxxxxx-an.a.run.app
#
# 前提条件:
#   - Artifact Registry リポジトリが作成済み
#   - GCE ファイアウォールルール (UDP 7777, TCP 7778) が作成済み
#   - GCE TCP ヘルスチェックが作成済み
#   - Secret Manager にシークレット (unity-server-auth-session-secret) が登録済み
#   - Cloud Build サービスアカウントに Compute Admin + Secret Manager Accessor 権限が付与済み
#   - _GAME_SERVER_URL の指定が必須（Unity DS が Game.Server へ自己登録するため）
#
# 注意: Cloud Run ではなく GCE (Container-Optimized OS) にデプロイ
# Unity Server は UDP を使用するため Cloud Run は使用不可

steps:
  # ===== Docker イメージをビルド =====
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/unity-server:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/unity-server:latest'
      - '-f'
      - 'docker/unity-server/Dockerfile'
      - '${_BUILD_CONTEXT}'

  # ===== Artifact Registry にプッシュ (SHORT_SHA タグ) =====
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-sha'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/unity-server:${SHORT_SHA}'

  # ===== Artifact Registry にプッシュ (latest タグ) =====
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/unity-server:latest'

  # ===== Secret Manager から Unity Server 認証シークレットを取得 =====
  # GCE は Secret Manager を直接マウントできないため、ビルド時に取得して container-env に焼き込む
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'get-unity-secret'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -z "${_GAME_SERVER_URL}" ]; then
          echo "ERROR: _GAME_SERVER_URL substitution is required."
          exit 1
        fi
        gcloud secrets versions access latest \
          --secret="${_SECRET_UNITY_SERVER_AUTH}" > /workspace/unity_secret.txt
        if [ ! -s /workspace/unity_secret.txt ]; then
          echo "ERROR: Failed to fetch ${_SECRET_UNITY_SERVER_AUTH} from Secret Manager."
          exit 1
        fi

  # ===== GCE インスタンステンプレートを作成 =====
  # Container-Optimized OS + Docker コンテナ指定
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'create-instance-template'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/unity-server:${SHORT_SHA}"
        TEMPLATE_NAME="${_INSTANCE_TEMPLATE_NAME}-${SHORT_SHA}"
        UNITY_SECRET=$(cat /workspace/unity_secret.txt)

        gcloud compute instance-templates create-with-container "$${TEMPLATE_NAME}" \
          --machine-type=${_MACHINE_TYPE} \
          --tags=${_NETWORK_TAG} \
          --container-image="$${IMAGE}" \
          --container-env="UNITY_SERVER_AUTH_SESSION_SECRET=$${UNITY_SECRET}" \
          --container-env="GAME_SERVER_URL=${_GAME_SERVER_URL}" \
          --container-env="UNITY_SERVER_PORT=${_UNITY_SERVER_PORT}" \
          --container-env="UNITY_SERVER_HEALTH_PORT=${_UNITY_SERVER_HEALTH_PORT}" \
          --container-arg="--port" \
          --container-arg="${_UNITY_SERVER_PORT}" \
          --container-arg="--health-port" \
          --container-arg="${_UNITY_SERVER_HEALTH_PORT}" \
          --metadata=google-logging-enabled=true \
          --scopes=https://www.googleapis.com/auth/cloud-platform \
          --region=${_REGION}

        echo "$${TEMPLATE_NAME}" > /workspace/template_name.txt

  # ===== Managed Instance Group を更新 =====
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'update-mig'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        TEMPLATE_NAME=$(cat /workspace/template_name.txt)

        # MIG が存在するか確認
        if gcloud compute instance-groups managed describe ${_INSTANCE_GROUP_NAME} \
            --zone=${_ZONE} 2>/dev/null; then
          echo "Updating existing MIG..."
          gcloud compute instance-groups managed set-instance-template \
            ${_INSTANCE_GROUP_NAME} \
            --zone=${_ZONE} \
            --template="$${TEMPLATE_NAME}"

          # autohealing initial-delay を 180 秒に更新
          # (初回 docker pull + Unity DS 起動を待つ猶予。失敗しても致命でない)
          gcloud compute instance-groups managed update \
            ${_INSTANCE_GROUP_NAME} \
            --zone=${_ZONE} \
            --initial-delay=${_INITIAL_DELAY} || true

          # ローリングアップデートを開始
          # --max-unavailable=0 は minimalAction=RESTART と衝突するため --minimal-action=replace を明示
          gcloud compute instance-groups managed rolling-action start-update \
            ${_INSTANCE_GROUP_NAME} \
            --zone=${_ZONE} \
            --version="template=$${TEMPLATE_NAME}" \
            --max-surge=1 \
            --max-unavailable=0 \
            --minimal-action=replace
        else
          echo "Creating new MIG..."
          gcloud compute instance-groups managed create ${_INSTANCE_GROUP_NAME} \
            --zone=${_ZONE} \
            --template="$${TEMPLATE_NAME}" \
            --size=1 \
            --health-check=${_HEALTH_CHECK_NAME} \
            --initial-delay=${_INITIAL_DELAY}
        fi

# ===== 変数（デフォルト値） =====
substitutions:
  _REGION: asia-northeast1
  _ZONE: asia-northeast1-b
  _REPO_NAME: game-unity-server
  _INSTANCE_TEMPLATE_NAME: unity-server-template
  _INSTANCE_GROUP_NAME: unity-server-mig
  _MACHINE_TYPE: e2-medium
  _NETWORK_TAG: unity-server
  _UNITY_SERVER_PORT: '7777'
  _UNITY_SERVER_HEALTH_PORT: '7778'
  _HEALTH_CHECK_NAME: unity-server-health-check
  # autohealing initial-delay 秒（image pull + Unity DS 起動の猶予、実測 120-180s）
  _INITIAL_DELAY: '180'
  # Unity Server ビルド成果物のパス（Cloud Build ワークスペース内）
  _BUILD_CONTEXT: 'server-build/'
  # Secret Manager シークレット名（GCE 起動時に container-env へ焼き込む）
  _SECRET_UNITY_SERVER_AUTH: unity-server-auth-session-secret
  # Game.Server URL（Unity DS が自己登録・ハートビートを送る宛先、必須指定）
  _GAME_SERVER_URL: ''

# ===== ビルドオプション =====
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# ===== ビルド結果のイメージ =====
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/unity-server:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/unity-server:latest'
