# docker/game-server/prod/cloudbuild.yml
# Google Cloud Build + Cloud Run デプロイ設定
#
# 使用方法（Cloud Shell または gcloud CLI）:
#   cd Unity6Portfolio
#   gcloud builds submit --config=docker/game-server/prod/cloudbuild.yml \
#     --substitutions=_INSTANCE_NAME=game-db
#
# 機密情報は Google Cloud Secret Manager で管理
# 事前に Secret Manager にシークレットを作成し、Cloud Run サービスアカウントに
# roles/secretmanager.secretAccessor を付与してください

steps:
  # ===== Docker イメージをビルド =====
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/game-server:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/game-server:latest'
      - '-f'
      - 'docker/game-server/prod/Dockerfile'
      - '.'

  # ===== Artifact Registry にプッシュ (SHORT_SHA タグ) =====
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-sha'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/game-server:${SHORT_SHA}'

  # ===== Artifact Registry にプッシュ (latest タグ) =====
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/game-server:latest'

  # ===== Cloud SQL 接続名を取得 =====
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'get-connection-name'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud sql instances describe ${_INSTANCE_NAME} \
          --format="value(connectionName)" > /workspace/connection_name.txt

  # ===== Cloud Run にデプロイ =====
  # 注意: Memorystore for Valkey / GCE 内部通信には Direct VPC Egress が必要
  # 事前にサブネットを作成してください:
  #   gcloud compute networks subnets create game-direct-vpc-subnet \
  #     --network=default --region=asia-northeast1 --range=10.10.0.0/26
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        CONNECTION_NAME=$(cat /workspace/connection_name.txt)
        SECRETS="ConnectionStrings__Default=${_SECRET_DB_CONNECTION}:latest,Jwt__Secret=${_SECRET_JWT}:latest,RequestSigning__SecretKey=${_SECRET_REQUEST_SIGNING}:latest,ConnectionStrings__Valkey=${_SECRET_VALKEY_CONNECTION}:latest,UnityServerAuth__SecretKey=${_SECRET_UNITY_SERVER_AUTH}:latest"
        if [ -n "${_SECRET_RESEND}" ]; then
          SECRETS="$${SECRETS},Resend__ApiKey=${_SECRET_RESEND}:latest"
        fi
        gcloud run deploy ${_SERVICE_NAME} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/game-server:${SHORT_SHA} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --add-cloudsql-instances=$${CONNECTION_NAME} \
          --clear-vpc-connector \
          --network=${_VPC_NETWORK} \
          --subnet=${_VPC_SUBNET} \
          --vpc-egress=private-ranges-only \
          --set-env-vars="ASPNETCORE_ENVIRONMENT=Production" \
          --set-env-vars="Jwt__Issuer=${_JWT_ISSUER}" \
          --set-env-vars="Jwt__Audience=${_JWT_AUDIENCE}" \
          --set-secrets="$${SECRETS}" \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10 \
          --concurrency=80 \
          --timeout=300

# ===== 変数（デフォルト値） =====
substitutions:
  _REGION: asia-northeast1
  _REPO_NAME: game-server
  _SERVICE_NAME: game-server
  _INSTANCE_NAME: game-db
  # Secret Manager シークレット名
  _SECRET_DB_CONNECTION: game-server-db-connection-string
  _SECRET_JWT: game-jwt-secret
  _SECRET_REQUEST_SIGNING: game-request-signing-secret
  _SECRET_RESEND: ''
  _SECRET_VALKEY_CONNECTION: game-valkey-connection
  _SECRET_UNITY_SERVER_AUTH: unity-server-auth-session-secret
  # 非機密設定
  _JWT_ISSUER: Game.Server
  _JWT_AUDIENCE: Game.Client
  # Direct VPC Egress（Memorystore / 内部通信に必要）
  _VPC_NETWORK: default
  _VPC_SUBNET: game-direct-vpc-subnet

# ===== ビルドオプション =====
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# ===== ビルド結果のイメージ =====
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/game-server:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/game-server:latest'
