# docker/game-server/prod/docker-compose.yml
# ローカル開発・テスト用（Cloud Run では使用しない）
#
# 使用方法:
#   cd E:\UnityProjects\Unity6Portfolio
#   docker compose -f docker/game-server/prod/docker-compose.yml up --build
#
# Cloud Run へのデプロイは cloudbuild.yaml または gcloud コマンドを使用

services:
  # ローカルテスト用 PostgreSQL
  db:
    image: postgres:17.8-alpine
    container_name: game-server-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gameserver}
      POSTGRES_USER: ${POSTGRES_USER:-gameuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gameuser} -d ${POSTGRES_DB:-gameserver}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ローカルテスト用 Valkey（本番は GCP Memorystore for Valkey を使用）
  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: game-server-valkey-prod
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    command: >
      valkey-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Game Server（Production 構成でローカル実行）
  server:
    image: game-server-prod
    container_name: game-server-app-prod
    build:
      context: ../../..
      dockerfile: docker/game-server/prod/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=db;Database=${POSTGRES_DB:-gameserver};Username=${POSTGRES_USER:-gameuser};Password=${POSTGRES_PASSWORD:?err}
      - ConnectionStrings__Valkey=valkey:6379,abortConnect=false
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
      - Jwt__Issuer=GameServer
      - Jwt__Audience=GameClient
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Game Realtime Server（Production 構成でローカル実行）
  realtime:
    image: game-realtime-prod
    container_name: game-server-realtime-prod
    build:
      context: ../../..
      dockerfile: docker/game-realtime/prod/Dockerfile
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Valkey=valkey:6379,abortConnect=false
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
      - Jwt__Issuer=GameServer
      - Jwt__Audience=GameClient
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Cloud SQL Proxy（Cloud SQL に接続してローカルテストする場合）
  # 使用する場合は以下をアンコメント
  # cloud-sql-proxy:
  #   image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0
  #   container_name: cloud-sql-proxy
  #   command:
  #     - "--port=5432"
  #     - "PROJECT_ID:REGION:INSTANCE_NAME"
  #   ports:
  #     - "5433:5432"
  #   volumes:
  #     - ~/.config/gcloud:/root/.config/gcloud:ro

volumes:
  pgdata:
  valkeydata:
