services:
  db:
    image: postgres:17.8-alpine
    container_name: game-server-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gameserver}
      POSTGRES_USER: ${POSTGRES_USER:-gameuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gameuser} -d ${POSTGRES_DB:-gameserver}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: game-server-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: game-server-aspnet
    container_name: game-server-aspnet
    build:
      context: ../..
      dockerfile: docker/game-server/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=db;Database=${POSTGRES_DB:-gameserver};Username=${POSTGRES_USER:-gameuser};Password=${POSTGRES_PASSWORD:?err}
      - ConnectionStrings__Valkey=valkey:6379,abortConnect=false,connectTimeout=5000
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
      - Jwt__Issuer=Game.Server
      - Jwt__Audience=Game.Client
      - UnityServerAuth__SecretKey=${UNITY_SERVER_AUTH_SESSION_SECRET:?Set UNITY_SERVER_AUTH_SESSION_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  realtime:
    image: game-realtime
    container_name: game-server-realtime
    build:
      context: ../..
      dockerfile: docker/game-realtime/Dockerfile
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Valkey=valkey:6379,abortConnect=false,connectTimeout=5000
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET in .env}
      - Jwt__Issuer=Game.Server
      - Jwt__Audience=Game.Client
      - GameServer__BaseUrl=http://server:8080
    depends_on:
      server:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --http2-prior-knowledge http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

