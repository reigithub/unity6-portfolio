services:
  db:
    image: postgres:17.8-alpine
    container_name: game-server-db
    environment:
      POSTGRES_DB: gameserver
      POSTGRES_USER: gameuser
      POSTGRES_PASSWORD: gamepassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameuser -d gameserver"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: game-server-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: game-server-app
    container_name: game-server-app
    build:
      context: ../..
      dockerfile: docker/game-server/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=db;Database=gameserver;Username=gameuser;Password=gamepassword
      - ConnectionStrings__Valkey=valkey:6379,abortConnect=false,connectTimeout=5000
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  realtime:
    image: game-realtime
    container_name: game-server-realtime
    build:
      context: ../..
      dockerfile: docker/game-realtime/Dockerfile
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Valkey=valkey:6379,abortConnect=false,connectTimeout=5000
      - Jwt__Secret=your-secret-key-must-be-at-least-32-characters-long
      - Jwt__Issuer=Game.Server
      - Jwt__Audience=Game.Client
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  valkey_data:
