# Unity Accelerator (Asset Cache Server)
#
# Unity CI Runner とは独立して動作するキャッシュサーバー
# Runner を再起動してもキャッシュは維持されます
#
# 使用方法:
#   docker compose up -d
#
# Dashboard: http://localhost:8080/dashboard

name: unity-accelerator

services:
  unity-accelerator:
    build:
      context: .
      dockerfile: Dockerfile
    image: unity-accelerator:custom
    container_name: unity-accelerator-runner
    restart: unless-stopped

    ports:
      # Asset Import Cache
      - "10080:10080"
      # Dashboard (HTTP)
      - "8080:80"

    environment:
      # データ保存先
      - UNITY_ACCELERATOR_PERSIST=/agent
      # ログ設定
      - UNITY_ACCELERATOR_LOG_STDOUT=true
      # 使用統計とクラウド機能の無効化
      - DISABLE_USAGE_STATS=true
      - COLLAB_REGISTRATION=disabled
      # クラウド接続を無効化
      - UNITY_ACCELERATOR_STANDALONE=true
      # Dashboard 認証
      - USER=${ACCELERATOR_USER:-admin}
      - PASSWORD=${ACCELERATOR_PASSWORD:-admin}

    volumes:
      # キャッシュデータの永続化（Named Volume - WSL2内に保存、高速）
      - unity-accelerator-data:/agent

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

    # ヘルスチェック無効化（curl インストール不可のため）
    # 動作確認: docker exec unity-ci-runner curl http://unity-accelerator:10080
    healthcheck:
      disable: true

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

    networks:
      - unity-ci-network

networks:
  unity-ci-network:
    name: unity-ci-network
    driver: bridge

# Named Volumes（WSL2内に保存、docker compose down -v で削除）
volumes:
  unity-accelerator-data:
    name: unity-accelerator-data
