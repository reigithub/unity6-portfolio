# docker/game-realtime/prod/cloudbuild.yml
# Game.Realtime Google Cloud Build + Cloud Run デプロイ設定
#
# 使用方法（Cloud Shell または gcloud CLI）:
#   cd Unity6Portfolio
#   gcloud builds submit --config=docker/game-realtime/prod/cloudbuild.yml \
#     --substitutions=_VALKEY_HOST=10.0.0.3
#
# 機密情報は Google Cloud Secret Manager で管理

steps:
  # ===== Docker イメージをビルド =====
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/game-realtime:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/game-realtime:latest'
      - '-f'
      - 'docker/game-realtime/prod/Dockerfile'
      - '.'

  # ===== Artifact Registry にプッシュ (SHORT_SHA タグ) =====
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-sha'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/game-realtime:${SHORT_SHA}'

  # ===== Artifact Registry にプッシュ (latest タグ) =====
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/game-realtime:latest'

  # ===== Cloud Run にデプロイ =====
  # Game.Server との違い:
  #   - Cloud SQL 不要（Valkey のみ）
  #   - --min-instances=1（StreamingHub 常時接続）
  #   - --session-affinity（スティッキーセッション）
  #   - --use-http2（gRPC 必須）
  #   - --timeout=3600（長時間接続対応）
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy ${_SERVICE_NAME} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/game-realtime:${SHORT_SHA} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --clear-vpc-connector \
          --network=${_VPC_NETWORK} \
          --subnet=${_VPC_SUBNET} \
          --vpc-egress=private-ranges-only \
          --set-env-vars="ASPNETCORE_ENVIRONMENT=Production" \
          --set-env-vars="ConnectionStrings__Valkey=${_VALKEY_HOST}:${_VALKEY_PORT},abortConnect=false,connectTimeout=5000" \
          --set-env-vars="Jwt__Issuer=${_JWT_ISSUER}" \
          --set-env-vars="Jwt__Audience=${_JWT_AUDIENCE}" \
          --set-secrets="Jwt__Secret=${_SECRET_JWT}:latest,UnityServerAuth__SecretKey=${_SECRET_UNITY_SERVER_AUTH}:latest" \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=1 \
          --max-instances=10 \
          --concurrency=100 \
          --timeout=3600 \
          --session-affinity \
          --use-http2

# ===== 変数（デフォルト値） =====
substitutions:
  _REGION: asia-northeast1
  _REPO_NAME: game-realtime
  _SERVICE_NAME: game-realtime
  # Secret Manager シークレット名
  _SECRET_JWT: game-jwt-secret
  _SECRET_UNITY_SERVER_AUTH: unity-server-auth-session-secret
  # 非機密設定
  _JWT_ISSUER: Game.Server
  _JWT_AUDIENCE: Game.Client
  # Memorystore for Valkey 設定
  _VALKEY_HOST: ''
  _VALKEY_PORT: '6379'
  # Direct VPC Egress（Memorystore / 内部通信に必要）
  _VPC_NETWORK: default
  _VPC_SUBNET: game-direct-vpc-subnet

# ===== ビルドオプション =====
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# ===== ビルド結果のイメージ =====
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/game-realtime:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/game-realtime:latest'
