# Unity 6 GitHub Actions Self-hosted Runner
#
# GitHub App を使用した認証を行います。
# - より細かい権限制御が可能
# - ユーザーに紐づかないため、担当者変更時も影響なし
# - 監査ログでアプリアクションとして記録
#
# 使用方法:
#   1. Accelerator を先に起動（別フォルダ）:
#      cd ../unity-accelerator && docker compose up -d
#
#   2. Runner を起動:
#      docker compose up -d
#
# ビルドプラットフォームを変更する場合:
#   .env ファイルで UNITY_MODULE を設定してください
#   例: UNITY_MODULE=webgl

name: unity-ci

services:
  # ============================================
  # Unity CI Runner: Windows Mono (GitHub Actions Self-hosted)
  # Windows クライアント / Windows DS / Windows Addressables ビルド用
  # ============================================
  unity-ci-windows-mono:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UNITY_VERSION: ${UNITY_VERSION:-6000.3.20f1}
        UNITY_MODULE: ${UNITY_MODULE:-windows-mono}
        IMAGE_VERSION: ${IMAGE_VERSION:-3}
    image: unity-ci-windows-mono:${UNITY_VERSION:-6000.3.20f1}
    container_name: unity-ci-windows-mono
    restart: unless-stopped

    environment:
      # Required - Repository
      - GITHUB_REPOSITORY=${GITHUB_REPOSITORY}

      # GitHub App authentication
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_INSTALLATION_ID=${GITHUB_APP_INSTALLATION_ID}

      # Private key (choose one method)
      # Method 1: PEM string with \n for newlines
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY:-}
      # Method 2: Base64 encoded (recommended)
      - GITHUB_APP_PRIVATE_KEY_BASE64=${GITHUB_APP_PRIVATE_KEY_BASE64:-}

      # Runner configuration
      - RUNNER_NAME=${RUNNER_NAME:-unity-ci-windows-mono}
      - RUNNER_LABELS=${RUNNER_LABELS:-self-hosted,linux,unity,docker,windows-mono}

      # Unity Accelerator 接続設定
      - UNITY_ACCELERATOR_ENDPOINT=unity-accelerator:10080

    volumes:
      # Unity license file
      - ${UNITY_LICENSE_PATH:-/var/lib/unity-license}:/unity-license:ro

      # Project Library cache (Named Volume - WSL2内に保存、高速)
      - unity-library-cache:/home/runner/.unity-library-cache

      # Unity global cache (Named Volume - WSL2内に保存、高速)
      - unity-global-cache:/home/runner/.local/share/unity3d

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 12G
        reservations:
          cpus: '2'
          memory: 8G

    # Security options
    # no-new-privileges:false に変更してキャッシュディレクトリの権限修正を許可
    security_opt:
      - no-new-privileges:false

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

    networks:
      - unity-ci-network

  # ============================================
  # Unity CI Runner: Linux IL2CPP (GitHub Actions Self-hosted)
  # Linux クライアント / Linux DS / Linux Addressables / テスト用
  # `linux-il2cpp` image は Linux Server バリアント（linux64_server_*_il2cpp / mono）
  # を内包するため、別途 linux-server runner は不要
  # ============================================
  unity-ci-linux-il2cpp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UNITY_VERSION: ${UNITY_VERSION:-6000.3.20f1}
        UNITY_MODULE: linux-il2cpp
        IMAGE_VERSION: ${IMAGE_VERSION:-3}
    image: unity-ci-linux-il2cpp:${UNITY_VERSION:-6000.3.20f1}
    container_name: unity-ci-linux-il2cpp
    restart: unless-stopped

    environment:
      # Required - Repository
      - GITHUB_REPOSITORY=${GITHUB_REPOSITORY}

      # GitHub App authentication
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_INSTALLATION_ID=${GITHUB_APP_INSTALLATION_ID}

      # Private key (choose one method)
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY:-}
      - GITHUB_APP_PRIVATE_KEY_BASE64=${GITHUB_APP_PRIVATE_KEY_BASE64:-}

      # Runner configuration
      - RUNNER_NAME=unity-ci-linux-il2cpp
      - RUNNER_LABELS=self-hosted,linux,unity,docker,linux-il2cpp

      # Unity Accelerator 接続設定
      - UNITY_ACCELERATOR_ENDPOINT=unity-accelerator:10080

    volumes:
      # Unity license file
      - ${UNITY_LICENSE_PATH:-/var/lib/unity-license}:/unity-license:ro

      # Project Library cache (runner 別に分離: Win64/Linux64 で Library 内容が異なるため)
      - unity-library-cache-linux-il2cpp:/home/runner/.unity-library-cache

      # Unity global cache
      - unity-global-cache-linux-il2cpp:/home/runner/.local/share/unity3d

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 12G
        reservations:
          cpus: '2'
          memory: 8G

    security_opt:
      - no-new-privileges:false

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

    networks:
      - unity-ci-network

# Accelerator と同じネットワークを使用（外部定義）
networks:
  unity-ci-network:
    external: true

# Named Volumes（WSL2内に保存、docker compose down -v で削除）
volumes:
  # unity-ci-windows-mono 用（既存名維持）
  unity-library-cache:
    name: unity-library-cache
  unity-global-cache:
    name: unity-global-cache
  # unity-ci-linux-il2cpp 用（新規）
  unity-library-cache-linux-il2cpp:
    name: unity-library-cache-linux-il2cpp
  unity-global-cache-linux-il2cpp:
    name: unity-global-cache-linux-il2cpp
