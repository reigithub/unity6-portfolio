# Unity 6 GitHub Actions Self-hosted Runner
#
# GitHub App を使用した認証を行います。
# - より細かい権限制御が可能
# - ユーザーに紐づかないため、担当者変更時も影響なし
# - 監査ログでアプリアクションとして記録
#
# 使用方法:
#   docker compose up -d
#
# ビルドプラットフォームを変更する場合:
#   .env ファイルで UNITY_MODULE を設定してください
#   例: UNITY_MODULE=webgl
#
# Unity Accelerator:
#   アセットインポートキャッシュを共有してビルド時間を短縮
#   Dashboard: http://localhost:8080/dashboard

name: unity-ci

services:
  # ============================================
  # Unity Accelerator (Asset Cache Server)
  # ============================================
  unity-accelerator:
    image: unitytechnologies/accelerator:latest
    container_name: unity-accelerator
    restart: unless-stopped

    ports:
      # Asset Import Cache
      - "10080:10080"
      # Dashboard (HTTP)
      - "8080:80"

    environment:
      # データ保存先
      - UNITY_ACCELERATOR_PERSIST=/agent
      # ログ設定
      - UNITY_ACCELERATOR_LOG_STDOUT=true
      # 使用統計の無効化
      - DISABLE_USAGE_STATS=yes
      # Dashboard 認証
      - USER=${ACCELERATOR_USER:-admin}
      - PASSWORD=${ACCELERATOR_PASSWORD:-admin}

    volumes:
      # キャッシュデータの永続化（Bind Mount）
      - type: bind
        source: ${ACCELERATOR_DATA_PATH:-/var/lib/unity-ci/accelerator}
        target: /agent

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health-agent"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

    networks:
      - runner-network

  # ============================================
  # Unity CI Runner (GitHub Actions Self-hosted)
  # ============================================
  unity-ci-runner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UNITY_VERSION: ${UNITY_VERSION:-6000.3.2f1}
        UNITY_MODULE: ${UNITY_MODULE:-windows-mono}
        IMAGE_VERSION: ${IMAGE_VERSION:-3}
    image: unity-ci-runner:${UNITY_VERSION:-6000.3.2f1}-${UNITY_MODULE:-windows-mono}
    container_name: unity-ci-runner
    restart: unless-stopped

    # Accelerator が起動してから Runner を起動
    depends_on:
      unity-accelerator:
        condition: service_healthy

    environment:
      # Required - Repository
      - GITHUB_REPOSITORY=${GITHUB_REPOSITORY}

      # GitHub App authentication
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_INSTALLATION_ID=${GITHUB_APP_INSTALLATION_ID}

      # Private key (choose one method)
      # Method 1: PEM string with \n for newlines
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY:-}
      # Method 2: Base64 encoded (recommended)
      - GITHUB_APP_PRIVATE_KEY_BASE64=${GITHUB_APP_PRIVATE_KEY_BASE64:-}

      # Runner configuration
      - RUNNER_NAME=${RUNNER_NAME:-unity-runner}
      - RUNNER_LABELS=${RUNNER_LABELS:-self-hosted,linux,unity,docker}

      # Unity Accelerator 接続設定
      - UNITY_ACCELERATOR_ENDPOINT=unity-accelerator:10080

    volumes:
      # Unity license file
      - ${UNITY_LICENSE_PATH:-/var/lib/unity-license}:/unity-license:ro

      # Project Library cache (Bind Mount - 永続化)
      - type: bind
        source: ${LIBRARY_CACHE_PATH:-/var/lib/unity-ci/library-cache}
        target: /home/runner/.unity-library-cache

      # Unity global cache (Bind Mount - 永続化)
      - type: bind
        source: ${UNITY_CACHE_PATH:-/var/lib/unity-ci/unity-cache}
        target: /home/runner/.local/share/unity3d

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 12G
        reservations:
          cpus: '2'
          memory: 8G

    # Security options
    # no-new-privileges:false に変更してキャッシュディレクトリの権限修正を許可
    security_opt:
      - no-new-privileges:false

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

    networks:
      - runner-network

networks:
  runner-network:
    driver: bridge
