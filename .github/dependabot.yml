version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # NuGet（Directory.Packages.props で一元管理）
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dotnet-minor:
        update-types: ["minor", "patch"]

  # Docker — .NET ベースイメージ（メジャーバージョンは手動管理）
  - package-ecosystem: "docker"
    directory: "/docker/game-server"
    schedule:
      interval: "weekly"
    groups:
      dotnet-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/docker/game-server/prod"
    schedule:
      interval: "weekly"
    groups:
      dotnet-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/docker/game-realtime"
    schedule:
      interval: "weekly"
    groups:
      dotnet-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/docker/game-realtime/prod"
    schedule:
      interval: "weekly"
    groups:
      dotnet-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/docker/migrate"
    schedule:
      interval: "weekly"
    groups:
      dotnet-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]

  # Docker — Unity Accelerator
  - package-ecosystem: "docker"
    directory: "/docker/unity-accelerator"
    schedule:
      interval: "weekly"
